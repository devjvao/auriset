<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presets do Auri · Auriset</title>
  <link rel="stylesheet" href="./quick-presets.css">
  <script type="module" src="./quick-presets.js"></script>
</head>
<body>
  <main class="picker" aria-labelledby="picker-title">
    <header class="picker-header">
      <span class="picker-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <h1 id="picker-title">Presets do Auri</h1>
      <span class="cable-status" id="cable-status" data-state="checking" role="status">Verificando cabo</span>
    </header>

    <div class="preset-list" id="preset-list" aria-describedby="keyboard-hint"></div>
    <p class="feedback" id="feedback" role="status" aria-atomic="true">Carregando presets…</p>
    <p class="keyboard-hint" id="keyboard-hint">
      <span><kbd>↑</kbd> <kbd>↓</kbd> Navegar</span>
      <span><kbd>Enter</kbd> Aplicar</span>
      <span><kbd>Esc</kbd> Fechar</span>
    </p>
  </main>
</body>
</html>
