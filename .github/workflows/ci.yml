name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/winicon/go.sum
      - name: Vet
        run: |
          go vet -tags production ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C tools/winicon vet ./...
      - name: Test with the race detector
        env:
          CGO_ENABLED: '1'
          CC: 'C:\mingw64\bin\gcc.exe'
        run: |
          go test -race -shuffle=on -tags production ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C tools/winicon test -race -shuffle=on ./...
      - name: Build Windows executable
        run: go build -tags production -trimpath -ldflags='-H windowsgui' -o build/bin/kuba-equalizer.exe ./cmd/kuba-equalizer

  lint:
    name: Go lint
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --build-tags production

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan the Windows app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags production ./...
